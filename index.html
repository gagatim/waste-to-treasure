<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>變廢為寶</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  /* 明亮版型：淡藍底、深藍文字、水=藍綠、糧食=桃紅、低彩度幾何背景；單欄置中 */
  :root {
    --bg: #F2F8FC;
    --navy: #152747;
    --muted: #52627A;
    --card: #FFFFFF;
    --line: #D9E6F0;
    --soft: #EAF3F9;
    --teal: #007FA3;
    --teal-soft: #E1F1F7;
    --pink: #ED5291;
    --pink-ink: #C2336F;
    --pink-soft: #FCE6EF;
    --shadow: 0 18px 40px -22px rgba(21, 39, 71, 0.35);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; background-color: var(--bg); color: var(--navy); }

  body {
    min-height: 100vh;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
    padding-block: clamp(24px, 6vw, 56px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* 低彩度幾何背景 */
  .geo { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .geo i { position: absolute; display: block; }
  .geo .a { width: 520px; height: 520px; border-radius: 50%; background: rgba(0,127,163,.08); left: -200px; top: -180px; }
  .geo .b { width: 360px; height: 360px; border-radius: 50%; background: rgba(237,82,145,.07); right: -140px; bottom: 6%; }
  .geo .c { width: 220px; height: 220px; border-radius: 36px; background: rgba(21,39,71,.04); right: 6%; top: 8%; transform: rotate(16deg); }
  .geo .d { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(0,127,163,.18); left: 6%; bottom: 12%; }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }

  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.24em;
    color: var(--teal);
    background: var(--teal-soft);
    padding: 6px 14px;
    border-radius: 999px;
  }

  h1 {
    margin: 0;
    font-weight: 900;
    font-size: clamp(2rem, 8vw, 2.4rem);
    letter-spacing: 0.1em;
    text-wrap: balance;
  }

  .tagline { margin: 0; color: var(--muted); font-size: 0.95rem; letter-spacing: 0.04em; text-wrap: balance; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: clamp(18px, 4.5vw, 28px);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .step { display: flex; flex-direction: column; gap: 12px; }
  .step-label { display: flex; align-items: center; gap: 10px; }
  .step-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--navy); color: #fff;
    font-size: 0.82rem; font-weight: 700; flex: none;
  }
  .step-title { font-weight: 700; font-size: 1.02rem; }

  /* 數量 */
  .quantity-box { display: flex; align-items: stretch; gap: 10px; }

  .qty-btn {
    flex: none; width: 52px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--soft); color: var(--navy);
    font-size: 1.4rem; font-weight: 700; cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .qty-btn:hover { background: var(--teal-soft); }
  .qty-btn:active { transform: scale(0.94); }

  .qty-display {
    flex: 1; min-width: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--soft); border: 1px solid var(--line); border-radius: 14px;
    position: relative;
  }
  .qty-display:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,127,163,.16); }

  .qty-display input {
    width: 100%; background: transparent; border: none; text-align: center;
    font-family: inherit; font-variant-numeric: tabular-nums; font-weight: 900;
    font-size: clamp(2rem, 9vw, 2.6rem); color: var(--navy); padding: 10px 4px 16px;
  }
  .qty-display input:focus-visible { outline: none; }
  .qty-display input::-webkit-outer-spin-button,
  .qty-display input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty-display input[type=number] { -moz-appearance: textfield; }

  .qty-unit { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; pointer-events: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--navy);
    border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .chip:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }
  .chip.clear { margin-left: auto; color: var(--muted); }

  .qty-btn:focus-visible, .chip:focus-visible, .convert-btn:focus-visible, .reset-link:focus-visible {
    outline: 3px solid var(--pink); outline-offset: 2px;
  }

  /* 分隔箭頭 */
  .conveyor { position: relative; height: 18px; display: flex; align-items: center; justify-content: center; }
  .conveyor::before {
    content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px;
    background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 16px);
  }
  .conveyor svg { position: relative; background: var(--card); padding: 0 8px; }
  .conveyor svg path { stroke: var(--muted); }

  /* 隨機說明 */
  .randomizer {
    display: flex; align-items: center; gap: 14px;
    background: var(--soft); border-radius: 16px; padding: 14px 16px;
  }
  .randomizer-icons { display: flex; align-items: center; gap: 8px; flex: none; }
  .randomizer-icons svg { width: 28px; height: 28px; }
  .randomizer-icons svg:first-child { color: var(--teal); }
  .randomizer-icons svg:last-child { color: var(--pink); }
  .randomizer-icons .vs { font-size: 0.8rem; color: var(--muted); }
  .randomizer-desc { margin: 0; font-size: 0.88rem; color: var(--muted); line-height: 1.55; }
  .randomizer-desc strong { color: var(--navy); }

  /* 轉換按鈕 */
  .convert-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    border: none; border-radius: 999px; padding: 16px;
    background: var(--teal); color: #fff;
    font-family: inherit; font-size: 1.08rem; font-weight: 700; letter-spacing: 0.3em; text-indent: 0.3em;
    cursor: pointer; box-shadow: 0 10px 24px rgba(0,127,163,.3);
    transition: transform .1s ease, box-shadow .1s ease, filter .15s ease, background .15s ease;
  }
  .convert-btn:hover:not(:disabled) { filter: brightness(1.07); }
  .convert-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 4px 12px rgba(0,127,163,.28); }
  .convert-btn:disabled { background: #B9C7D6; box-shadow: none; cursor: not-allowed; }
  .convert-btn svg { width: 20px; height: 20px; }

  /* 結果 */
  .result {
    border-radius: 18px; padding: 18px;
    background: var(--soft); border: 1px solid var(--line);
    display: none; flex-direction: column; gap: 12px;
    animation: reveal .4s ease;
  }
  .result.show { display: flex; }
  .result-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .result-title { font-weight: 900; font-size: 1.05rem; }
  .result-detail { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { border-radius: 14px; padding: 14px 10px; text-align: center; min-width: 0; }
  .tile.water { background: var(--teal-soft); color: var(--teal); }
  .tile.food { background: var(--pink-soft); color: var(--pink-ink); }
  .t-lbl { display: block; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; }
  .t-num { display: block; font-size: clamp(2rem, 9vw, 2.6rem); font-weight: 900; line-height: 1.15; font-variant-numeric: tabular-nums; }

  .split-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .split-water, .split-food { height: 100%; width: 0%; transition: width .6s ease; }
  .split-water { background: var(--teal); }
  .split-food { background: var(--pink); }
  .split-labels { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: -4px; }
  .split-labels .lbl-water { color: var(--teal); font-weight: 700; }
  .split-labels .lbl-food { color: var(--pink-ink); font-weight: 700; }

  @keyframes reveal { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .totals {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
    padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 0.85rem; color: var(--muted);
  }
  .totals-values { font-variant-numeric: tabular-nums; color: var(--navy); font-weight: 700; }
  .reset-link { background: none; border: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; font-size: 0.82rem; padding: 4px; }
  .reset-link:hover { color: var(--navy); }

  footer { text-align: center; color: var(--muted); font-size: 0.78rem; padding: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .result { animation: none; }
    .qty-btn, .convert-btn, .split-water, .split-food { transition: none; }
  }
</style>
</head>
<body>
<div class="geo" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <span class="eyebrow">資源轉換站</span>
    <h1>變廢為寶</h1>
    <p class="tagline">輸入垃圾數量,電腦以 1:1 比例隨機轉換成水或糧食</p>
  </header>

  <div class="card">
    <div class="step">
      <div class="step-label">
        <span class="step-num">1</span>
        <span class="step-title">選擇你擁有的垃圾數量</span>
      </div>

      <div class="quantity-box">
        <button class="qty-btn" id="qtyMinus" type="button" aria-label="減少數量">&minus;</button>
        <div class="qty-display">
          <input id="qtyInput" type="number" inputmode="numeric" min="0" step="1" value="0" aria-label="垃圾數量">
          <span class="qty-unit">個垃圾</span>
        </div>
        <button class="qty-btn" id="qtyPlus" type="button" aria-label="增加數量">&plus;</button>
      </div>

      <div class="chips">
        <button class="chip" data-add="10" type="button">+10</button>
        <button class="chip" data-add="50" type="button">+50</button>
        <button class="chip" data-add="100" type="button">+100</button>
        <button class="chip clear" id="qtyClear" type="button">清空</button>
      </div>
    </div>

    <div class="conveyor" aria-hidden="true">
      <svg width="22" height="18" viewBox="0 0 22 18" fill="none">
        <path d="M1 9H21M21 9L14 2M21 9L14 16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="step">
      <div class="step-label">
        <span class="step-num">2</span>
        <span class="step-title">電腦隨機分配</span>
      </div>

      <div class="randomizer">
        <div class="randomizer-icons" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M12 2C12 2 5 11 5 15.5C5 19.6 8.13 22 12 22C15.87 22 19 19.6 19 15.5C19 11 12 2 12 2Z"/>
          </svg>
          <span class="vs">/</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21V10"/>
            <path d="M12 10C12 10 6 9 6 3C10 3 12 6 12 10Z"/>
            <path d="M12 14C12 14 18 13 18 7C14 7 12 10 12 14Z"/>
          </svg>
        </div>
        <p class="randomizer-desc"><strong>水與糧食各 50% 機率</strong>,由系統隨機決定,玩家無法選擇。</p>
      </div>
    </div>

    <button class="convert-btn" id="convertBtn" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4v5h5"/>
        <path d="M20 20v-5h-5"/>
        <path d="M5.5 9A7 7 0 0 1 19 8"/>
        <path d="M18.5 15A7 7 0 0 1 5 16"/>
      </svg>
      <span id="convertBtnLabel">轉換</span>
    </button>

    <div class="result" id="result" role="status" aria-live="polite">
      <div class="result-head">
        <div class="result-title">分配完成</div>
        <div class="result-detail" id="resultDetail">垃圾 -0 → 水 +0 ・ 糧食 +0</div>
      </div>
      <div class="tiles">
        <div class="tile water"><span class="t-lbl">水</span><span class="t-num" id="waterNum">+0</span></div>
        <div class="tile food"><span class="t-lbl">糧食</span><span class="t-num" id="foodNum">+0</span></div>
      </div>
      <div class="split-bar" aria-hidden="true">
        <div class="split-water" id="splitWater"></div>
        <div class="split-food" id="splitFood"></div>
      </div>
      <div class="split-labels">
        <span class="lbl-water" id="splitWaterLabel">水 0%</span>
        <span class="lbl-food" id="splitFoodLabel">糧食 0%</span>
      </div>
    </div>

    <div class="totals">
      <span>累積轉換:<span class="totals-values" id="totalsValues">水 0 · 糧食 0</span></span>
      <button class="reset-link" id="resetTotals" type="button">重置紀錄</button>
    </div>
  </div>

  <footer>1 垃圾 = 1 資源,每一份垃圾各有 50% 機率變成水或糧食</footer>
</div>

<script>
(function () {
  var qtyInput = document.getElementById('qtyInput');
  var qtyMinus = document.getElementById('qtyMinus');
  var qtyPlus = document.getElementById('qtyPlus');
  var qtyClear = document.getElementById('qtyClear');
  var chips = document.querySelectorAll('.chip[data-add]');
  var convertBtn = document.getElementById('convertBtn');
  var convertBtnLabel = document.getElementById('convertBtnLabel');
  var result = document.getElementById('result');
  var resultDetail = document.getElementById('resultDetail');
  var waterNum = document.getElementById('waterNum');
  var foodNum = document.getElementById('foodNum');
  var splitWater = document.getElementById('splitWater');
  var splitFood = document.getElementById('splitFood');
  var splitWaterLabel = document.getElementById('splitWaterLabel');
  var splitFoodLabel = document.getElementById('splitFoodLabel');
  var totalsValues = document.getElementById('totalsValues');
  var resetTotals = document.getElementById('resetTotals');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MAX_QTY = 99999;
  var totals = { water: 0, food: 0 };

  function loadTotals() {
    try {
      var raw = localStorage.getItem('wastehero-totals');
      if (raw) totals = JSON.parse(raw);
    } catch (e) { /* storage unavailable, keep defaults */ }
  }

  function saveTotals() {
    try {
      localStorage.setItem('wastehero-totals', JSON.stringify(totals));
    } catch (e) { /* storage unavailable, ignore */ }
  }

  function renderTotals() {
    totalsValues.textContent = '水 ' + totals.water + ' · 糧食 ' + totals.food;
  }

  function clampQty(n) {
    n = Math.floor(Number(n) || 0);
    if (n < 0) n = 0;
    if (n > MAX_QTY) n = MAX_QTY;
    return n;
  }

  function getQty() {
    return clampQty(qtyInput.value);
  }

  function setQty(n) {
    qtyInput.value = clampQty(n);
    updateConvertState();
  }

  function updateConvertState() {
    convertBtn.disabled = getQty() <= 0;
  }

  qtyInput.addEventListener('input', updateConvertState);
  qtyInput.addEventListener('blur', function () { setQty(getQty()); });

  qtyMinus.addEventListener('click', function () { setQty(getQty() - 1); });
  qtyPlus.addEventListener('click', function () { setQty(getQty() + 1); });
  qtyClear.addEventListener('click', function () { setQty(0); });

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      setQty(getQty() + Number(chip.dataset.add));
    });
  });

  function randomSplit(qty) {
    var water = 0;
    for (var i = 0; i < qty; i++) {
      if (Math.random() < 0.5) water++;
    }
    return { water: water, food: qty - water };
  }

  /* ---------- 特效：數字滾動、彩色紙屑、音效（不影響分配結果） ---------- */
  var fx = document.getElementById('fx'), fctx = fx.getContext('2d');
  var particles = [], fxRunning = false, sprites = {};

  function sizeFx() { fx.width = window.innerWidth; fx.height = window.innerHeight; }
  sizeFx();
  window.addEventListener('resize', sizeFx);

  function sprite(color) {
    if (sprites[color]) return sprites[color];
    var s = document.createElement('canvas');
    s.width = s.height = 24;
    var g = s.getContext('2d');
    g.fillStyle = color;
    g.beginPath(); g.arc(12, 12, 10, 0, Math.PI * 2); g.fill();
    return (sprites[color] = s);
  }
  function burst(x, y, n, colors, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = Math.random() * power + 2;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, life: 1,
        decay: 0.009 + Math.random() * 0.012, size: Math.random() * 6 + 5,
        color: colors[Math.floor(Math.random() * colors.length)] });
    }
    if (particles.length > 200) particles.splice(0, particles.length - 200);
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxTick); }
  }
  function fxTick() {
    fctx.clearRect(0, 0, fx.width, fx.height);
    var j = 0;
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.vx *= 0.985; p.life -= p.decay;
      if (p.life <= 0) continue;
      particles[j++] = p;
      fctx.globalAlpha = Math.min(1, p.life * 1.6);
      fctx.drawImage(sprite(p.color), p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    particles.length = j;
    if (j) requestAnimationFrame(fxTick);
    else { fxRunning = false; fctx.clearRect(0, 0, fx.width, fx.height); }
  }

  var ac;
  function tone(f, t, d, type, v) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(v || 0.1, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + d);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + d);
    } catch (e) { /* audio unavailable */ }
  }

  function countUp(el, target, prefix) {
    if (reduceMotion || target === 0) { el.textContent = prefix + target; return; }
    var start = performance.now(), dur = 700;
    function step(now) {
      var u = Math.min(1, (now - start) / dur);
      var eased = 1 - Math.pow(1 - u, 3);
      el.textContent = prefix + Math.round(target * eased);
      if (u < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function celebrate() {
    [523, 659, 784].forEach(function (f, i) { tone(f, i * 0.09, 0.25, 'triangle', 0.1); });
    if (reduceMotion) return;
    var r = result.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + 40, 44, ['#007FA3', '#ED5291', '#152747', '#7CCBE0'], 8);
  }

  convertBtn.addEventListener('click', function () {
    var qty = getQty();
    if (qty <= 0) return;

    convertBtn.disabled = true;
    convertBtnLabel.textContent = '分配中…';
    if (!reduceMotion) {
      for (var i = 0; i < 6; i++) tone(400 + i * 40, i * 0.07, 0.05, 'square', 0.03);
    }

    setTimeout(function () {
      var split = randomSplit(qty);

      totals.water += split.water;
      totals.food += split.food;
      saveTotals();
      renderTotals();

      resultDetail.textContent = '垃圾 -' + qty + ' → 水 +' + split.water + ' ・ 糧食 +' + split.food;

      var waterPct = Math.round((split.water / qty) * 100);
      var foodPct = 100 - waterPct;
      splitWater.style.width = waterPct + '%';
      splitFood.style.width = foodPct + '%';
      splitWaterLabel.textContent = '水 ' + waterPct + '%';
      splitFoodLabel.textContent = '糧食 ' + foodPct + '%';

      result.classList.add('show');
      countUp(waterNum, split.water, '+');
      countUp(foodNum, split.food, '+');
      celebrate();

      convertBtnLabel.textContent = '轉換';
      setQty(0);
    }, 450);
  });

  resetTotals.addEventListener('click', function () {
    totals = { water: 0, food: 0 };
    saveTotals();
    renderTotals();
    result.classList.remove('show');
  });

  loadTotals();
  renderTotals();
  updateConvertState();
})();
</script>
</body>
</html>
