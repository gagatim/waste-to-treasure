<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>變廢為寶</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #EDEEE3;
    --bg-vignette: #E2E6D5;
    --surface: #FFFFFF;
    --surface-2: #E6E8D8;
    --ink: #1E2B20;
    --muted: #5C6B5C;
    --border: #D7D9C7;
    --brand: #3D6B4C;
    --brand-dark: #274935;
    --brand-ink: #FFFFFF;
    --gold: #C68A2E;
    --gold-soft: #F4E6C8;
    --water: #2D7FA0;
    --water-soft: #DCEEF4;
    --food: #B8792A;
    --food-soft: #F2E4CC;
    --shadow: 0 20px 45px -25px rgba(30, 43, 32, 0.45);
    --focus: #2D7FA0;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101B14;
      --bg-vignette: #16241A;
      --surface: #182619;
      --surface-2: #1F3020;
      --ink: #E9ECDD;
      --muted: #9AAB94;
      --border: #2B3D2C;
      --brand: #6FAE81;
      --brand-dark: #4C8A63;
      --brand-ink: #0E1912;
      --gold: #E0AE55;
      --gold-soft: #3A2E1A;
      --water: #6FC3E0;
      --water-soft: #1B333B;
      --food: #E0AE55;
      --food-soft: #362A18;
      --shadow: 0 20px 45px -20px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #101B14;
    --bg-vignette: #16241A;
    --surface: #182619;
    --surface-2: #1F3020;
    --ink: #E9ECDD;
    --muted: #9AAB94;
    --border: #2B3D2C;
    --brand: #6FAE81;
    --brand-dark: #4C8A63;
    --brand-ink: #0E1912;
    --gold: #E0AE55;
    --gold-soft: #3A2E1A;
    --water: #6FC3E0;
    --water-soft: #1B333B;
    --food: #E0AE55;
    --food-soft: #362A18;
    --shadow: 0 20px 45px -20px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-vignette), var(--bg) 60%);
    color: var(--ink);
    font-family: 'Noto Sans TC', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 5vw, 56px) 16px;
  }

  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px 8px 4px;
  }

  .eyebrow {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--brand);
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: clamp(2.1rem, 7vw, 2.6rem);
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.02em;
  }

  .tagline {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: clamp(18px, 4vw, 28px);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .step {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .step-label {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--brand);
    color: var(--brand-ink);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    flex: none;
  }

  .step-title {
    font-weight: 700;
    font-size: 1.02rem;
  }

  /* Quantity control */
  .quantity-box {
    display: flex;
    align-items: stretch;
    gap: 10px;
  }

  .qty-btn {
    flex: none;
    width: 48px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 1.3rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .qty-btn:hover { background: var(--border); }
  .qty-btn:active { transform: scale(0.94); }
  .qty-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .qty-display {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    position: relative;
  }

  .qty-display input {
    width: 100%;
    background: transparent;
    border: none;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(1.8rem, 8vw, 2.4rem);
    color: var(--ink);
    padding: 10px 4px;
  }
  .qty-display input:focus-visible { outline: none; }
  .qty-display input::-webkit-outer-spin-button,
  .qty-display input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty-display input[type=number] { -moz-appearance: textfield; }

  .qty-unit {
    position: absolute;
    right: 14px;
    bottom: 8px;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--brand); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .chip.clear { margin-left: auto; color: var(--muted); }

  /* conveyor divider */
  .conveyor {
    position: relative;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .conveyor::before {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    top: 50%;
    height: 2px;
    background: repeating-linear-gradient(90deg, var(--border) 0 8px, transparent 8px 16px);
  }
  .conveyor svg { position: relative; background: var(--bg); padding: 0 8px; }
  .conveyor svg path { stroke: var(--muted); }

  /* Randomizer */
  .randomizer {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1.5px dashed var(--border);
    background: var(--surface-2);
    border-radius: 16px;
    padding: 14px 16px;
  }

  .randomizer-icons {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
  }
  .randomizer-icons svg { width: 26px; height: 26px; }
  .randomizer-icons svg:first-child { color: var(--water); }
  .randomizer-icons svg:last-child { color: var(--food); }
  .randomizer-icons .vs {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .randomizer-desc {
    margin: 0;
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.5;
  }
  .randomizer-desc strong { color: var(--ink); }

  /* Split bar */
  .split-bar {
    display: flex;
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--border);
    margin-top: 10px;
  }
  .split-water, .split-food { height: 100%; width: 0%; transition: width 0.5s ease; }
  .split-water { background: var(--water); }
  .split-food { background: var(--food); }

  .split-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .split-labels .lbl-water { color: var(--water); font-weight: 600; }
  .split-labels .lbl-food { color: var(--food); font-weight: 600; }

  /* Convert button */
  .convert-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: none;
    border-radius: 14px;
    padding: 16px;
    background: var(--brand);
    color: var(--brand-ink);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 1.08rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
  }
  .convert-btn:hover:not(:disabled) { background: var(--brand-dark); }
  .convert-btn:active:not(:disabled) { transform: scale(0.98); }
  .convert-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .convert-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .convert-btn svg { width: 20px; height: 20px; }

  /* Result */
  .result {
    border-radius: 14px;
    padding: 16px;
    background: var(--gold-soft);
    border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--border));
    display: none;
    flex-direction: column;
    gap: 4px;
    animation: reveal 0.35s ease;
  }
  .result.show { display: flex; }
  .result-title {
    font-weight: 700;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .result-detail {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.05rem;
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .totals {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }

  .totals-values {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    font-weight: 600;
  }

  .reset-link {
    background: none;
    border: none;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.82rem;
    padding: 0;
  }
  .reset-link:hover { color: var(--ink); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    padding: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .result { animation: none; }
    .qty-btn, .convert-btn, .split-water, .split-food { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="eyebrow">資源轉換站</span>
    <h1>變廢為寶</h1>
    <p class="tagline">輸入垃圾數量,電腦以 1:1 比例隨機轉換成水或糧食</p>
  </header>

  <div class="card">
    <div class="step">
      <div class="step-label">
        <span class="step-num">1</span>
        <span class="step-title">選擇你擁有的垃圾數量</span>
      </div>

      <div class="quantity-box">
        <button class="qty-btn" id="qtyMinus" type="button" aria-label="減少數量">&minus;</button>
        <div class="qty-display">
          <input id="qtyInput" type="number" inputmode="numeric" min="0" step="1" value="0" aria-label="垃圾數量">
          <span class="qty-unit">個垃圾</span>
        </div>
        <button class="qty-btn" id="qtyPlus" type="button" aria-label="增加數量">&plus;</button>
      </div>

      <div class="chips">
        <button class="chip" data-add="10" type="button">+10</button>
        <button class="chip" data-add="50" type="button">+50</button>
        <button class="chip" data-add="100" type="button">+100</button>
        <button class="chip clear" id="qtyClear" type="button">清空</button>
      </div>
    </div>

    <div class="conveyor" aria-hidden="true">
      <svg width="22" height="18" viewBox="0 0 22 18" fill="none">
        <path d="M1 9H21M21 9L14 2M21 9L14 16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="step">
      <div class="step-label">
        <span class="step-num">2</span>
        <span class="step-title">電腦隨機分配</span>
      </div>

      <div class="randomizer">
        <div class="randomizer-icons" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M12 2C12 2 5 11 5 15.5C5 19.6 8.13 22 12 22C15.87 22 19 19.6 19 15.5C19 11 12 2 12 2Z"/>
          </svg>
          <span class="vs">/</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21V10"/>
            <path d="M12 10C12 10 6 9 6 3C10 3 12 6 12 10Z"/>
            <path d="M12 14C12 14 18 13 18 7C14 7 12 10 12 14Z"/>
          </svg>
        </div>
        <p class="randomizer-desc"><strong>水與糧食各 50% 機率</strong>,由系統隨機決定,玩家無法選擇。</p>
      </div>
    </div>

    <button class="convert-btn" id="convertBtn" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4v5h5"/>
        <path d="M20 20v-5h-5"/>
        <path d="M5.5 9A7 7 0 0 1 19 8"/>
        <path d="M18.5 15A7 7 0 0 1 5 16"/>
      </svg>
      <span id="convertBtnLabel">轉換</span>
    </button>

    <div class="result" id="result">
      <div class="result-title" id="resultTitle">🎲 分配完成</div>
      <div class="result-detail" id="resultDetail">垃圾 -0 → 水 +0 ・ 糧食 +0</div>
      <div class="split-bar" aria-hidden="true">
        <div class="split-water" id="splitWater"></div>
        <div class="split-food" id="splitFood"></div>
      </div>
      <div class="split-labels">
        <span class="lbl-water" id="splitWaterLabel">水 0%</span>
        <span class="lbl-food" id="splitFoodLabel">糧食 0%</span>
      </div>
    </div>

    <div class="totals">
      <span>累積轉換:<span class="totals-values" id="totalsValues">水 0 · 糧食 0</span></span>
      <button class="reset-link" id="resetTotals" type="button">重置紀錄</button>
    </div>
  </div>

  <footer>1 垃圾 = 1 資源,每一份垃圾各有 50% 機率變成水或糧食</footer>
</div>

<script>
(function () {
  var qtyInput = document.getElementById('qtyInput');
  var qtyMinus = document.getElementById('qtyMinus');
  var qtyPlus = document.getElementById('qtyPlus');
  var qtyClear = document.getElementById('qtyClear');
  var chips = document.querySelectorAll('.chip[data-add]');
  var convertBtn = document.getElementById('convertBtn');
  var convertBtnLabel = document.getElementById('convertBtnLabel');
  var result = document.getElementById('result');
  var resultDetail = document.getElementById('resultDetail');
  var splitWater = document.getElementById('splitWater');
  var splitFood = document.getElementById('splitFood');
  var splitWaterLabel = document.getElementById('splitWaterLabel');
  var splitFoodLabel = document.getElementById('splitFoodLabel');
  var totalsValues = document.getElementById('totalsValues');
  var resetTotals = document.getElementById('resetTotals');

  var MAX_QTY = 99999;
  var totals = { water: 0, food: 0 };

  function loadTotals() {
    try {
      var raw = localStorage.getItem('wastehero-totals');
      if (raw) totals = JSON.parse(raw);
    } catch (e) { /* storage unavailable, keep defaults */ }
  }

  function saveTotals() {
    try {
      localStorage.setItem('wastehero-totals', JSON.stringify(totals));
    } catch (e) { /* storage unavailable, ignore */ }
  }

  function renderTotals() {
    totalsValues.textContent = '水 ' + totals.water + ' · 糧食 ' + totals.food;
  }

  function clampQty(n) {
    n = Math.floor(Number(n) || 0);
    if (n < 0) n = 0;
    if (n > MAX_QTY) n = MAX_QTY;
    return n;
  }

  function getQty() {
    return clampQty(qtyInput.value);
  }

  function setQty(n) {
    qtyInput.value = clampQty(n);
    updateConvertState();
  }

  function updateConvertState() {
    convertBtn.disabled = getQty() <= 0;
  }

  qtyInput.addEventListener('input', updateConvertState);
  qtyInput.addEventListener('blur', function () { setQty(getQty()); });

  qtyMinus.addEventListener('click', function () { setQty(getQty() - 1); });
  qtyPlus.addEventListener('click', function () { setQty(getQty() + 1); });
  qtyClear.addEventListener('click', function () { setQty(0); });

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      setQty(getQty() + Number(chip.dataset.add));
    });
  });

  function randomSplit(qty) {
    var water = 0;
    for (var i = 0; i < qty; i++) {
      if (Math.random() < 0.5) water++;
    }
    return { water: water, food: qty - water };
  }

  convertBtn.addEventListener('click', function () {
    var qty = getQty();
    if (qty <= 0) return;

    convertBtn.disabled = true;
    convertBtnLabel.textContent = '分配中…';

    setTimeout(function () {
      var split = randomSplit(qty);

      totals.water += split.water;
      totals.food += split.food;
      saveTotals();
      renderTotals();

      resultDetail.textContent = '垃圾 -' + qty + ' → 水 +' + split.water + ' ・ 糧食 +' + split.food;

      var waterPct = Math.round((split.water / qty) * 100);
      var foodPct = 100 - waterPct;
      splitWater.style.width = waterPct + '%';
      splitFood.style.width = foodPct + '%';
      splitWaterLabel.textContent = '水 ' + waterPct + '%';
      splitFoodLabel.textContent = '糧食 ' + foodPct + '%';

      result.classList.add('show');

      convertBtnLabel.textContent = '轉換';
      setQty(0);
    }, 450);
  });

  resetTotals.addEventListener('click', function () {
    totals = { water: 0, food: 0 };
    saveTotals();
    renderTotals();
    result.classList.remove('show');
  });

  loadTotals();
  renderTotals();
  updateConvertState();
})();
</script>
</body>
</html>
